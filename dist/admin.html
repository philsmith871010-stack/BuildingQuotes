<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datum Rate Book</title>
<meta name="description" content="Configure pricing for extensions, renovations, loft conversions, new builds and outdoor work.">

<style>
/* ===========================================================================
   Datum
   A drawing sheet, not a brochure. Graphite paper, cyanotype accent, and a
   clay tone reserved for one job: showing what is already there.
   =========================================================================== */

/* --- Tokens: light is the base ------------------------------------------ */
:root {
  --paper:      #ECEEEB;
  --surface:    #F5F7F4;
  --well:       #E1E5E0;
  --ink:        #15181A;
  --ink-2:      #565E62;
  --ink-3:      #7C858A;
  --rule:       #C3C9C2;
  --rule-soft:  #D9DED8;
  --accent:     #154C7C;
  --accent-ink: #0F3A60;
  --accent-soft:#E2EAF1;
  --on-accent:  #F7F9FB;
  --clay:       #A9714B;
  --warn:       #9A3B24;
  --warn-soft:  #F3E4DF;
  --good:       #2F6B47;
  --shadow:     0 1px 2px rgba(20,24,26,.06), 0 8px 28px -18px rgba(20,24,26,.30);

  /* drawing */
  --dr-grid:          #DCE0DA;
  --dr-new-top:       #D3E1EC;
  --dr-new-left:      #B4CBDE;
  --dr-new-right:     #96B3CB;
  --dr-new-stroke:    #154C7C;
  --dr-course:        rgba(21,76,124,.26);
  --dr-old-top:       #D7D4CD;
  --dr-old-roof2:     #CAC6BE;
  --dr-old-left:      #C4BFB6;
  --dr-old-right:     #B1ABA1;
  --dr-old-stroke:    #8C867B;
  --dr-glass:         #E4EEF4;
  --dr-earth-left:    #CFC9BA;
  --dr-earth-right:   #BDB6A5;
  --dr-earth-stroke:  #7E7665;
  --dr-hatch:         rgba(74,68,55,.55);
  --dr-ground-line:   #4A4E4A;
  --dr-warn:          #9A3B24;
  --dr-dim:           #6C7479;
  --dr-chip:          #F7F7F5;
  --dr-trunk:         #7A5E45;
  --dr-canopy:        #CBD6C6;
  --dr-canopy-stroke: #7E9479;

  --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --disp: "Archivo", "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --gutter: clamp(1.15rem, 4vw, 3.25rem);
  --maxw: 1240px;
}

/* System dark, unless the viewer has explicitly chosen light */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #101416;
    --surface:    #171C1F;
    --well:       #0B0F11;
    --ink:        #E7EAE8;
    --ink-2:      #9AA3A7;
    --ink-3:      #6E787D;
    --rule:       #2C3438;
    --rule-soft:  #1F2629;
    --accent:     #6BA6E8;
    --accent-ink: #9CC6F2;
    --accent-soft:#17293A;
    --on-accent:  #0B1620;
    --clay:       #C08A63;
    --warn:       #E0795E;
    --warn-soft:  #2C1C17;
    --good:       #6FBF8F;
    --shadow:     0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);

    --dr-grid:          #1E2528;
    --dr-new-top:       #2E4D67;
    --dr-new-left:      #244059;
    --dr-new-right:     #1B3145;
    --dr-new-stroke:    #6BA6E8;
    --dr-course:        rgba(107,166,232,.30);
    --dr-old-top:       #3B342B;
    --dr-old-roof2:     #332C25;
    --dr-old-left:      #2E2820;
    --dr-old-right:     #251F19;
    --dr-old-stroke:    #9A7A5C;
    --dr-glass:         #1D3345;
    --dr-earth-left:    #24221C;
    --dr-earth-right:   #1C1A15;
    --dr-earth-stroke:  #6A6152;
    --dr-hatch:         rgba(180,170,145,.32);
    --dr-dim:           #8A9297;
    --dr-chip:          #171C1F;
    --dr-trunk:         #8A6A4C;
    --dr-canopy:        #2D3B2B;
    --dr-canopy-stroke: #6E8A69;
  }
}

/* Explicit dark wins in the other direction */
:root[data-theme="dark"] {
  --paper:      #101416;
  --surface:    #171C1F;
  --well:       #0B0F11;
  --ink:        #E7EAE8;
  --ink-2:      #9AA3A7;
  --ink-3:      #6E787D;
  --rule:       #2C3438;
  --rule-soft:  #1F2629;
  --accent:     #6BA6E8;
  --accent-ink: #9CC6F2;
  --accent-soft:#17293A;
  --on-accent:  #0B1620;
  --clay:       #C08A63;
  --warn:       #E0795E;
  --warn-soft:  #2C1C17;
  --good:       #6FBF8F;
  --shadow:     0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);

  --dr-grid:          #1E2528;
  --dr-new-top:       #2E4D67;
  --dr-new-left:      #244059;
  --dr-new-right:     #1B3145;
  --dr-new-stroke:    #6BA6E8;
  --dr-course:        rgba(107,166,232,.30);
  --dr-old-top:       #302D28;
  --dr-old-roof2:     #2A2722;
  --dr-old-left:      #26231E;
  --dr-old-right:     #1F1D19;
  --dr-old-stroke:    #6F685C;
  --dr-glass:         #1D3345;
  --dr-earth-left:    #2B2721;
  --dr-earth-right:   #211E19;
  --dr-earth-stroke:  #776E5C;
  --dr-hatch:         rgba(196,185,158,.45);
  --dr-ground-line:   #B6BDB8;
  --dr-warn:          #E0795E;
  --dr-dim:           #8A9297;
  --dr-chip:          #171C1F;
  --dr-trunk:         #8A6A4C;
  --dr-canopy:        #2D3B2B;
  --dr-canopy-stroke: #6E8A69;
}

/* --- Base ---------------------------------------------------------------- */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 {
  font-family: var(--disp);
  font-weight: 700;
  line-height: 1.03;
  letter-spacing: -0.022em;
  text-wrap: balance;
  margin: 0;
}
h1 { font-size: clamp(2.35rem, 4.6vw, 4rem); font-stretch: 116%; letter-spacing: -0.032em; }
h2 { font-size: clamp(1.9rem, 3.6vw, 3rem); font-stretch: 110%; }
h3 { font-size: clamp(1.15rem, 1.7vw, 1.4rem); font-stretch: 104%; letter-spacing: -0.012em; }
p  { margin: 0; }

a { color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 2px;
}

.wrap {
  width: 100%;
  max-width: var(--maxw);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.lede { font-size: clamp(1.05rem, 1.5vw, 1.28rem); color: var(--ink-2); max-width: 62ch; }
/* Grid, so paragraphs space themselves. Only ever wrap block children in it. */
.prose { max-width: 64ch; color: var(--ink-2); display: grid; gap: .9rem; }
.prose-flow { max-width: 64ch; color: var(--ink-2); }
.prose strong { color: var(--ink); font-weight: 600; }

/* Mono utility: labels, figures, anything measured */
.eyebrow {
  font-family: var(--mono);
  font-size: .69rem;
  font-weight: 500;
  letter-spacing: .19em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* --- Sheet frame --------------------------------------------------------- */
.frame { position: fixed; inset: 12px; pointer-events: none; z-index: 60; }
.frame span {
  position: absolute; width: 13px; height: 13px;
  border: 1px solid var(--rule); opacity: .85;
}
.frame span:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
.frame span:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
.frame span:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
.frame span:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }
@media (max-width: 900px) { .frame { display: none; } }

/* --- Nav ----------------------------------------------------------------- */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule-soft);
}
.nav-in {
  display: flex; align-items: center; gap: 1.5rem;
  height: 62px;
}
.brand { display: flex; align-items: center; gap: .55rem; text-decoration: none; }
.brand svg { display: block; }
.brand b {
  font-family: var(--disp); font-weight: 700; font-stretch: 122%;
  font-size: 1.06rem; letter-spacing: .07em; text-transform: uppercase;
}
.nav-links { display: flex; gap: 1.6rem; margin-left: auto; }
.nav-links a {
  font-size: .87rem; color: var(--ink-2); text-decoration: none;
  padding-block: .3rem; border-bottom: 1px solid transparent;
}
.nav-links a:hover { color: var(--ink); border-bottom-color: var(--accent); }
@media (max-width: 860px) { .nav-links { display: none; } }

.btn {
  font-family: var(--sans); font-size: .9rem; font-weight: 600;
  border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent);
  padding: .62rem 1.15rem; border-radius: 2px; cursor: pointer;
  text-decoration: none; display: inline-flex; align-items: center; gap: .5rem;
  transition: background .16s ease, color .16s ease, transform .16s ease;
}
.btn:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn:active { transform: translateY(1px); }
.btn[hidden] { display: none; }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn-ghost:hover { background: var(--well); border-color: var(--ink-3); color: var(--ink); }
.btn-sm { padding: .44rem .8rem; font-size: .82rem; }

/* --- Section rhythm ------------------------------------------------------ */
.band { border-top: 1px solid var(--rule-soft); padding-block: clamp(3.4rem, 7vw, 6rem); }
section[id], main[id] { scroll-margin-top: 78px; }
.band-head { display: grid; gap: .85rem; margin-bottom: clamp(1.8rem, 3.5vw, 3rem); }
.band-head .lede { margin-top: .15rem; }

/* --- Hero ---------------------------------------------------------------- */
.hero { padding-top: clamp(2.6rem, 6vw, 4.6rem); padding-bottom: clamp(1.4rem, 3vw, 2.4rem); }
.hero h1 { margin-bottom: 1.15rem; }
.hero-grid { display: grid; gap: clamp(1.4rem, 3vw, 2.6rem); align-items: start; }
@media (min-width: 1000px) { .hero-grid { grid-template-columns: 1.05fr .95fr; } }
.hero-claim { display: grid; gap: 1.15rem; }
.hero-facts { display: flex; flex-wrap: wrap; gap: .5rem; }
.fact {
  font-family: var(--mono); font-size: .73rem; letter-spacing: .04em;
  border: 1px solid var(--rule); border-radius: 2px;
  padding: .32rem .6rem; color: var(--ink-2); background: var(--surface);
}

/* --- The drawing --------------------------------------------------------- */
.stage {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 3px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.stage-bar {
  display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
  padding: .6rem .85rem;
  border-bottom: 1px solid var(--rule-soft);
  background: var(--well);
}
.stage-bar .eyebrow { margin-right: auto; }
.legend { display: flex; gap: .85rem; flex-wrap: wrap; }
.legend i {
  font-style: normal; font-family: var(--mono); font-size: .66rem;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);
  display: inline-flex; align-items: center; gap: .38rem;
}
.legend i::before {
  content: ""; width: 11px; height: 11px; border-radius: 1px;
  border: 1px solid currentColor;
}
.legend .l-new::before   { background: var(--dr-new-left); border-color: var(--dr-new-stroke); }
.legend .l-old::before   { background: var(--dr-old-left); border-color: var(--dr-old-stroke); }
.legend .l-earth::before { background: var(--dr-earth-left); border-color: var(--dr-earth-stroke); }

.iso { display: block; width: 100%; height: 100%; touch-action: none; }
.iso-wrap {
  padding: .5rem .5rem .25rem;
  min-height: clamp(330px, 46vh, 520px);
  display: grid;
}
.dim-text {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  fill: var(--ink); letter-spacing: .02em;
}
.tree-label {
  font-family: var(--mono); font-size: 8.5px; letter-spacing: .12em;
  fill: var(--ink-3);
}
.dim-chip rect { transition: fill .14s ease, stroke .14s ease; }
.dim-chip:hover rect, .dim-chip:focus-visible rect { fill: var(--accent-soft); stroke: var(--accent); }
.dim-chip:focus-visible { outline: none; }
.dim-chip:focus-visible rect { stroke-width: 2; }

.stage-hint {
  display: flex; align-items: center; justify-content: center; gap: .45rem;
  padding: .55rem .85rem .7rem;
  font-family: var(--mono); font-size: .68rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3);
}
.stage-hint svg { opacity: .7; }

/* --- Running price ------------------------------------------------------- */
.readout {
  border: 1px solid var(--rule); border-radius: 3px;
  background: var(--surface); box-shadow: var(--shadow);
  display: grid;
}
.readout-main { padding: 1.15rem 1.25rem 1.25rem; display: grid; gap: .5rem; }
.readout-range {
  font-family: var(--disp); font-weight: 700; font-stretch: 112%;
  font-size: clamp(1.85rem, 4.4vw, 2.9rem);
  letter-spacing: -0.03em; line-height: 1;
  font-variant-numeric: tabular-nums;
  display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap;
}
.readout-range .to { font-size: .42em; font-weight: 500; color: var(--ink-3); font-stretch: 100%; letter-spacing: .04em; }
.readout-sub { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.readout-note { font-size: .82rem; color: var(--ink-2); }

.gauge { display: grid; gap: .38rem; }
.gauge-track { height: 4px; background: var(--well); border-radius: 2px; overflow: hidden; border: 1px solid var(--rule-soft); }
.gauge-fill { height: 100%; background: var(--accent); width: 0; transition: width .5s cubic-bezier(.2,.7,.3,1); }
.gauge-label { font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }

.vat-toggle { display: inline-flex; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
.vat-toggle button {
  font-family: var(--mono); font-size: .68rem; letter-spacing: .09em; text-transform: uppercase;
  padding: .35rem .62rem; border: 0; background: transparent; color: var(--ink-3); cursor: pointer;
}
.vat-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* --- Spec: the questions -------------------------------------------------- */
.spec { display: grid; gap: 1px; background: var(--rule-soft); border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
@media (min-width: 760px)  { .spec { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1180px) { .spec { grid-template-columns: 1fr 1fr 1fr; } }

.q { background: var(--surface); padding: 1.15rem 1.2rem 1.25rem; display: grid; gap: .8rem; align-content: start; }
.q-head { display: grid; gap: .3rem; }
.q-title { font-family: var(--disp); font-weight: 700; font-size: 1.02rem; font-stretch: 104%; letter-spacing: -.01em; }
.q-help { font-size: .82rem; color: var(--ink-3); line-height: 1.45; }
.q-wide { grid-column: 1 / -1; }

.seg { display: flex; flex-wrap: wrap; gap: .4rem; }
.seg button {
  font-family: var(--sans); font-size: .85rem; font-weight: 500;
  border: 1px solid var(--rule); background: var(--paper); color: var(--ink-2);
  padding: .48rem .78rem; border-radius: 2px; cursor: pointer;
  transition: border-color .14s ease, color .14s ease, background .14s ease;
}
.seg button:hover { border-color: var(--ink-3); color: var(--ink); }
.seg button[aria-pressed="true"] {
  border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 600;
}

.stepper { display: flex; align-items: center; gap: .55rem; }
.stepper button {
  width: 34px; height: 34px; flex: none; border: 1px solid var(--rule);
  background: var(--paper); color: var(--ink); border-radius: 2px; cursor: pointer;
  font-size: 1.05rem; line-height: 1; display: grid; place-items: center;
}
.stepper button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.stepper button:disabled { opacity: .38; cursor: not-allowed; }
.stepper output {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: .95rem; min-width: 5.4rem; text-align: center;
  border: 1px solid var(--rule-soft); border-radius: 2px; padding: .35rem .3rem;
  background: var(--paper);
}

.range { width: 100%; accent-color: var(--accent); }

.tree-row { display: grid; gap: .45rem; grid-template-columns: 1fr auto auto; align-items: center; }
.tree-row select, .tree-row input {
  font-family: var(--sans); font-size: .85rem; color: var(--ink);
  background: var(--paper); border: 1px solid var(--rule); border-radius: 2px;
  padding: .42rem .5rem; width: 100%;
}
.tree-row input { width: 5.4rem; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tree-row .kill {
  border: 1px solid var(--rule); background: var(--paper); color: var(--ink-3);
  width: 32px; height: 32px; border-radius: 2px; cursor: pointer; line-height: 1;
}
.tree-row .kill:hover { color: var(--warn); border-color: var(--warn); }
.tree-list { display: grid; gap: .5rem; }

.flag {
  display: flex; gap: .55rem; align-items: flex-start;
  font-size: .8rem; line-height: 1.45;
  border-left: 2px solid var(--warn); background: var(--warn-soft);
  color: var(--ink-2); padding: .55rem .7rem; border-radius: 0 2px 2px 0;
}
.flag b { color: var(--warn); font-weight: 600; }
.flag-good { border-left-color: var(--good); background: var(--accent-soft); }
.flag-good b { color: var(--good); }

/* --- Cost stack ----------------------------------------------------------- */
.cost-grid { display: grid; gap: clamp(1.5rem, 3vw, 2.6rem); align-items: start; }
@media (min-width: 1000px) { .cost-grid { grid-template-columns: 1.15fr .85fr; } }

.stack { display: grid; gap: .7rem; }
.stack-bar {
  display: flex; height: 42px; width: 100%; overflow: hidden;
  border: 1px solid var(--rule); border-radius: 2px; background: var(--well);
}
.stack-bar span {
  display: block; height: 100%;
  border-right: 1px solid var(--surface);
  transition: width .55s cubic-bezier(.2,.7,.3,1);
}
.stack-bar span:last-child { border-right: 0; }
.s-trade       { background: var(--dr-new-right); }
.s-fees        { background: var(--dr-new-left); }
.s-margin      { background: var(--clay); }
.s-contingency { background: var(--dr-earth-left); }
.s-vat         { background: var(--ink-3); }

.stack-key { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; }
.stack-key i {
  font-style: normal; font-family: var(--mono); font-size: .68rem;
  letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: .4rem;
}
.stack-key i::before { content: ""; width: 10px; height: 10px; border-radius: 1px; background: currentColor; }
.stack-key .k-trade::before       { background: var(--dr-new-right); }
.stack-key .k-fees::before        { background: var(--dr-new-left); }
.stack-key .k-margin::before      { background: var(--clay); }
.stack-key .k-contingency::before { background: var(--dr-earth-left); }
.stack-key .k-vat::before         { background: var(--ink-3); }

.items { width: 100%; border-collapse: collapse; font-size: .88rem; }
.items th {
  text-align: left; font-family: var(--mono); font-weight: 500;
  font-size: .66rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); padding: 0 0 .55rem; border-bottom: 1px solid var(--rule);
}
.items th:last-child, .items td:last-child { text-align: right; }
.items td { padding: .6rem 0; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
.items .lbl { font-weight: 600; color: var(--ink); }
.items .det { font-size: .78rem; color: var(--ink-3); line-height: 1.4; margin-top: .12rem; }

<script>
/*
 * Datum — the rate book
 * ---------------------------------------------------------------------------
 * Everything Lee can price, in one structure he can edit.
 *
 * A rate book is:
 *   commercial   VAT, margin split, contingency, confidence
 *   buildTypes   extension, renovation, loft, new build, external works
 *                each with its own MEASUREMENTS, RATE LINES and MODIFIERS
 *   foundations  the shared tree / soil depth model
 *   fees         architectural, structural, building control by council
 *   regions      postcode multipliers
 *
 * A RATE LINE is one priced item: a rate, a unit, and the measurement that
 * drives it. That is the whole abstraction, and it is the same one a quantity
 * surveyor's schedule uses.
 *
 * `source` marks where a figure came from:
 *   'lee'         supplied by Lee Todd
 *   'placeholder' invented so the demonstration works — needs a real rate
 */
(function (root) {
  'use strict';

  var UNITS = {
    per_m2:       { label: 'per m²',        suffix: '/m²',  qtyUnit: 'm²' },
    per_linear_m: { label: 'per linear m',  suffix: '/m',   qtyUnit: 'm'  },
    per_m3:       { label: 'per m³',        suffix: '/m³',  qtyUnit: 'm³' },
    per_unit:     { label: 'each',          suffix: ' each', qtyUnit: 'no.' },
    per_item:     { label: 'fixed sum',     suffix: '',     qtyUnit: 'job' }
  };

  function L(id, label, detail, unit, driver, rate, source) {
    return { id: id, label: label, detail: detail, unit: unit, driver: driver,
             rate: rate, group: 'trade', source: source, enabled: true };
  }

  var ACCESS = {
    id: 'access', label: 'Site access', help: 'Can a machine, a skip and a grab lorry reach the work?',
    appliesTo: 'all', value: 'good',
    options: [
      { id: 'good',       label: 'Clear rear access', factor: 1.00 },
      { id: 'restricted', label: 'Through the house',  factor: 1.09 },
      { id: 'none',       label: 'Hand dig and barrow', factor: 1.20 }
    ]
  };

  function spec(hi, top) {
    return {
      id: 'spec', label: 'Specification', help: 'The level of finish the client is buying.',
      appliesTo: 'all', value: 'standard',
      options: [
        { id: 'standard', label: 'Standard', factor: 1.00 },
        { id: 'high',     label: 'High',     factor: hi },
        { id: 'premium',  label: 'Premium',  factor: top }
      ]
    };
  }


  /* =====================================================================
     Rooms — the granularity a renovation actually has
     =====================================================================
     A renovation is not one intensity spread over a whole house. The kitchen
     goes back to brick, the bedrooms get a skim and a coat, the hall gets
     painted. Pricing all of it off a single "floor area treated" figure is
     wrong for almost every real job.

     The unit that matches how people think about it is the room — and the
     sketch tool already produces the room list, so it costs the client nothing
     to ask.

     ONE question per room, four answers. Not "does this room need electrics,
     floors, ceilings, plaster": that is four questions times eight rooms, and
     nobody finishes it.

     Room areas are not asked for either. The total is measured accurately from
     the sketch; each room takes a share of it weighted by what kind of room it
     is. Individual rooms will be out; across a house the errors cancel.
     ===================================================================== */

  var ROOM_TYPES = [
    { id: 'kitchen',  label: 'Kitchen',        weight: 12 },
    { id: 'living',   label: 'Living room',    weight: 16 },
    { id: 'bedroom',  label: 'Bedroom',        weight: 11 },
    { id: 'bathroom', label: 'Bathroom',       weight: 5 },
    { id: 'wc',       label: 'WC',             weight: 2 },
    { id: 'hall',     label: 'Hall / landing', weight: 10 },
    { id: 'other',    label: 'Other room',     weight: 9 }
  ];

  /* `short` is what fits on a row next to eight other rooms; `label` is what
     the client reads when they are deciding what the four words mean. */
  var ROOM_LEVELS = [
    { id: 'none',     label: 'Leave it',  short: 'Leave',    blurb: 'Not touched.' },
    { id: 'decorate', label: 'Decorate',  short: 'Decorate', blurb: 'Prep, two coats and a new floor covering.' },
    { id: 'refit',    label: 'Refit',     short: 'Refit',    blurb: 'Plus a skim, lighting and sockets, a new door and a radiator.' },
    { id: 'strip',    label: 'Strip out', short: 'Strip',    blurb: 'Plus back to brick and joists, first fix, a new ceiling and insulation.' }
  ];

  var RANK = { none: 0, decorate: 1, refit: 2, strip: 3 };

  function roomType(id) {
    var found = ROOM_TYPES[6];
    ROOM_TYPES.forEach(function (t) { if (t.id === id) found = t; });
    return found;
  }

  /** Each room's share of the measured floor area, by type weight. */
  function roomAreas(rooms, floorArea) {
    var total = 0;
    rooms.forEach(function (r) { total += roomType(r.type).weight; });
    if (!total) return rooms.map(function () { return 0; });
    return rooms.map(function (r) {
      return Math.round((floorArea || 0) * roomType(r.type).weight / total * 10) / 10;
    });
  }

  /** The quantities the rate lines are driven by, worked out from the rooms. */
  function roomMeasurements(rooms, areas) {

        m.doorsReplaced += 1;
        m.radiators += 1;

        if (r.type === 'bathroom') m.bathrooms += 1;
        if (r.type === 'wc') m.wcs += 1;

      if (lv >= 3) m.stripArea += a;
    });
    ['workedArea', 'refitArea', 'stripArea'].forEach(function (k) {
      m[k] = Math.round(m[k] * 10) / 10;
    });
    return m;
  }

      { type: 'bedroom',  level: 'refit' },
      { type: 'bedroom',  level: 'refit' },
      { type: 'bathroom', level: 'strip' },
      { type: 'wc',       level: 'refit' },
      { type: 'hall',     level: 'decorate' }
    ];
  }

    types: ROOM_TYPES, levels: ROOM_LEVELS, rank: RANK,
    typeOf: roomType, areas: roomAreas, measurements: roomMeasurements,

      steps: [
        { id: 'size',   view: 'plan',    short: 'Size', title: 'How big is it going to be?', lede: 'Drag either dimension on the drawing. Everything else on this site is measured from these two numbers.' },
        { id: 'build',  view: 'plan',    short: 'Build', title: 'How is it built?', lede: 'The construction of the external walls, and how much of the garden wall is glass.', modifiers: ['wallType'] },
        { id: 'ground', view: 'section', short: 'Ground', title: 'What is underneath?', lede: 'The question that catches people out. On shrinkable clay a thirsty tree decides how deep you dig, and depth is expensive.', ground: true },
        { id: 'inside', view: 'plan',    short: 'Inside', title: 'What is going inside?', lede: 'Opening the new space into the house, and the two rooms that carry real labour.', modifiers: ['access', 'spec'] }
      ],
      lines: [

      ],

        L('ren.strip',      'Strip out and clear',    'Finishes off, back to brick and joists. Removals, skips and protection', 'per_m2', 'stripArea', 85, 'placeholder'),

  /* =====================================================================
     Pricing — one generic function for every build type
     ===================================================================== */

  function typeById(book, id) {
    for (var i = 0; i < book.buildTypes.length; i++) {
      if (book.buildTypes[i].id === id) return book.buildTypes[i];
    }
    return null;
  }

  /*
   * A worked example has to be complete: the admin shows it as a set of
   * editable figures and prices the rate book against them. A room-by-room
   * type computes most of its quantities from the room list, so they are
   * resolved here, once, and from then on it looks like every other type.
   */
  BUILD_TYPES.forEach(function (t) {
    if (!t.typical || !t.typical.rooms) return;
    var m = t.typical.measurements;
    var derived = roomMeasurements(t.typical.rooms, roomAreas(t.typical.rooms, m.floorArea || 0));
    Object.keys(derived).forEach(function (k) { if (m[k] === undefined) m[k] = derived[k]; });
  });

  function factorFor(type, selections, lineId) {
    var f = 1;
    (type.modifiers || []).forEach(function (m) {
      var applies = m.appliesTo === 'all' ||
        (Array.isArray(m.appliesTo) && m.appliesTo.indexOf(lineId) >= 0);
      if (!applies) return;
      var chosen = (selections && selections[m.id]) || m.value;
      for (var i = 0; i < m.options.length; i++) {
        if (m.options[i].id === chosen) { f *= m.options[i].factor; return; }
      }
    });
    return f;
  }

  function qtyLabel(line, qty) {
    var u = UNITS[line.unit];
    if (line.unit === 'per_item') return 'Fixed sum';
    var n = qty % 1 ? qty.toFixed(2) : String(qty);
    return n + ' ' + u.qtyUnit + ' at £' + line.rate.toLocaleString('en-GB') + u.suffix;
  }

  /**
   * Price any job in the book.
   * @param book
   * @param typeId       which build type
   * @param job          { measurements, modifiers, ground, region, council, answered }
   */
  /** Just the building work for one build type. No fees, no margin, no VAT. */
  function tradeLines(book, typeId, job) {
    var type = typeById(book, typeId);
    if (!type) return { lines: [], trade: 0, ground: null };

    var m = job.measurements || {};
    var lines = [];
    var regionFactor = 1;
    (book.regions || []).forEach(function (r) {
      if (r.id === (job.region || book.activeRegion)) regionFactor = r.factor;
    });

    type.lines.forEach(function (line) {
      if (!line.enabled) return;
      var qty = line.unit === 'per_item' ? 1 : (m[line.driver] || 0);
      if (!qty) return;
      lines.push({
        key: line.id, group: 'trade', type: typeId, typeName: type.name,
        label: line.label, detail: qtyLabel(line, qty), source: line.source,
        amount: qty * line.rate * factorFor(type, job.modifiers, line.id) * regionFactor
      });
    });

    // foundations, where the build type has ground to dig
    var ground = null;
    if (type.usesFoundations && root.DATUM.TREES) {
      var g = job.ground || { soil: 'high', trees: [] };
      ground = root.DATUM.TREES.requiredDepth(g.trees, g.soil, book.foundations);
      var f = book.foundations;
      var cost = 0, detail = '';
      var area = m.floorArea || m.footprintArea || 0;
      var perim = m.perimeter || 0;

      if (ground.piled) {
        cost = area * f.piledPerSqm;
        detail = 'Piles and ground beam — ' + ground.depth.toFixed(2) + ' m influence depth';
      } else if (ground.depth > f.nominalDepth) {
        var extra = ground.depth - f.nominalDepth;
        var vol = perim * f.trenchWidth * extra;
        cost = vol * f.perCubicMetre;
        detail = 'Dig to ' + ground.depth.toFixed(2) + ' m, ' + extra.toFixed(2) +
                 ' m deeper than standard — ' + vol.toFixed(1) + ' m³';
      }
      if (cost > 0) {
        lines.push({ key: typeId + '.foundations', group: 'trade', type: typeId, typeName: type.name,
          label: 'Deeper foundations', detail: detail, amount: cost * regionFactor, source: 'placeholder' });
      }
    }

    return {
      lines: lines,
      trade: lines.reduce(function (t, l) { return t + l.amount; }, 0),
      ground: ground, regionFactor: regionFactor,
      hasOpenings: (m.wallRemoval || m.steels || 0) > 0,
      area: m.floorArea || m.footprintArea || m.patioArea || 0
    };
  }

  /** Fees, margin, contingency and VAT — charged once, over whatever trade total. */
  function wrapUp(book, trade, lines, opts) {
    var c = book.commercial, fe = book.fees;
    var arch = Math.max(trade * fe.architectural.pct, fe.architectural.min);
    lines.push({ key: 'architectural', group: 'fees', label: 'Architectural drawings',
      detail: opts.multi ? 'One survey and one set of drawings for the whole project'
                         : 'Survey, plans and planning submission', amount: arch });

    var struct = fe.structural.base + (opts.hasOpenings ? fe.structural.withOpenings : 0);
    lines.push({ key: 'structural', group: 'fees', label: 'Structural engineer',
      detail: opts.multi ? 'One engineer across every part of the job' : 'Calculations and design',
      amount: struct });

    var council = null;
    (book.councils || []).forEach(function (x) { if (x.id === opts.council) council = x; });
    var bc = council ? council.fee : fe.buildingControl.base;
    lines.push({ key: 'buildingControl', group: 'fees', label: 'Building control',
      detail: (council ? council.name + ' — ' : 'Your council — ') +
        (opts.multi ? 'one application, not one per job' : 'never a private inspector'), amount: bc });

    var fees = arch + struct + bc;
    var base = trade + fees;
    var margin = c.marginIncludedInRates ? 0 : base * c.margin.total;
    if (margin > 0) {
      lines.push({ key: 'margin', group: 'margin', label: 'Margin, in the open',
        detail: 'Datum ' + (c.margin.datum * 100) + '% · your builder and consultants ' + (c.margin.trade * 100) + '%',
        amount: margin });
    }
    var contingency = (base + margin) * c.contingency;
    lines.push({ key: 'contingency', group: 'contingency', label: 'Contingency',
      detail: (c.contingency * 100) + '% held back for the unforeseen — unspent, it comes back to you',
      amount: contingency });

    var exVat = base + margin + contingency;
    var vat = exVat * c.vatRate;
    var spread = Math.max(c.confidence.floor, c.confidence.start - (opts.answered || 0) * c.confidence.perAnswer);

    return {
      lines: lines, trade: trade, fees: fees, feeParts: { arch: arch, struct: struct, bc: bc },
      margin: margin, datumShare: base * c.margin.datum, tradeShare: base * c.margin.trade,
      contingency: contingency, exVat: exVat, vat: vat, incVat: exVat + vat, spread: spread,
      low: Math.round((exVat + vat) * (1 - spread)), high: Math.round((exVat + vat) * (1 + spread)),
      lowExVat: Math.round(exVat * (1 - spread)), highExVat: Math.round(exVat * (1 + spread))
    };
  }

  /** One build type on its own. */
  function priceJob(book, typeId, job) {
    var t = tradeLines(book, typeId, job);
    var r = wrapUp(book, t.trade, t.lines.slice(), {
      hasOpenings: t.hasOpenings, council: job.council, answered: job.answered, multi: false
    });
    r.typeId = typeId;
    r.ground = t.ground;
    r.regionFactor = t.regionFactor;
    r.area = t.area;
    return r;
  }

  /**
   * Several build types as ONE project. This is the honest way to price an
   * extension plus a loft plus a refurbishment: the building work adds up, but
   * you only pay for one set of drawings, one engineer and one building control
   * application — because that is all the job actually needs.
   */
  function priceProject(book, typeIds, jobs) {
    var lines = [], trade = 0, openings = false, answered = 0;
    var ground = null, area = 0, byType = [];

    typeIds.forEach(function (id) {
      var jb = jobs[id] || {};
      var t = tradeLines(book, id, jb);
      lines = lines.concat(t.lines);
      trade += t.trade;
      openings = openings || t.hasOpenings;
      // questions put to the client, plus anything they actively changed
      answered += Object.keys(jb.seen || {}).length + Object.keys(jb.touched || {}).length;
      if (t.ground && (!ground || t.ground.depth > ground.depth)) ground = t.ground;
      area += t.area;
      byType.push({ id: id, name: (typeById(book, id) || {}).name, trade: t.trade });
    });

    var r = wrapUp(book, trade, lines, {
      hasOpenings: openings, council: (jobs.council || null), answered: answered,
      multi: typeIds.length > 1
    });
    r.typeIds = typeIds;
    r.byType = byType;
    r.ground = ground;
    r.area = area;

    // what the same work would cost bought as separate jobs, fees and all
    var separate = 0;
    typeIds.forEach(function (id) { separate += priceJob(book, id, jobs[id] || {}).incVat; });
    r.separately = separate;
    r.saving = Math.max(0, separate - r.incVat);
    return r;
  }

  /** Price a build type's own worked example — used for impact analysis. */
  function priceTypical(book, typeId) {
    var type = typeById(book, typeId);
    if (!type || !type.typical) return null;
    var t = type.typical;
    var m = JSON.parse(JSON.stringify(t.measurements));
    if (t.rooms) {
      var rm = roomMeasurements(t.rooms, roomAreas(t.rooms, m.floorArea));
      Object.keys(rm).forEach(function (k) { m[k] = rm[k]; });
    }
    return priceJob(book, typeId, {
      measurements: m, modifiers: t.modifiers, ground: t.ground, answered: 6
    });
  }

  /** Every figure still waiting on a real rate. */
  function placeholders(book) {
    var out = [];
    book.buildTypes.forEach(function (t) {
      t.lines.forEach(function (l) {
        if (l.source === 'placeholder') out.push({ type: t.id, typeName: t.name, id: l.id, label: l.label });
      });
    });
    ['architectural', 'structural', 'buildingControl'].forEach(function (k) {
      if (book.fees[k].source === 'placeholder') out.push({ type: 'fees', typeName: 'Fees', id: k, label: k });
    });
    if (book.foundations.source === 'placeholder') out.push({ type: 'foundations', typeName: 'Foundations', id: 'foundations', label: 'Foundation rates' });
    return out;
  }

  root.DATUM = root.DATUM || {};
  root.DATUM.RATEBOOK = {
    UNITS: UNITS,
    tradeLines: tradeLines,
    priceProject: priceProject,
    defaultBook: defaultBook,
    typeById: typeById,
    priceJob: priceJob,
    priceTypical: priceTypical,
    placeholders: placeholders,
    factorFor: factorFor,
    ROOMS: ROOMS
  };
})(window);

 * Datum — trees, soil and foundation depth
 * ---------------------------------------------------------------------------
 * Shaped after NHBC Standards Chapter 4.2 (building near trees), which sets
 * foundation depth from three things:
 *
 *   1. the tree's water demand      (how thirsty the species is)
 *   2. D/H                          (distance to the tree / its MATURE height)
 *   3. soil shrinkability           (plasticity index of the clay)
 *
 * IMPORTANT — the depth table below is OUR DRAFT, interpolated from the shape
 * of the NHBC curves. It is close enough to be persuasive in a demo and NOT
 * good enough to dig to. Lee, or his engineer, needs to replace ANCHORS with
 * the real values before this ever prices live work. See docs/ASSUMPTIONS.md.
 */
(function (root) {
  'use strict';

  // Mature height in metres, and water demand. NHBC 4.2 Table 2.
  var SPECIES = [
    { id: 'oak',        name: 'Oak',              demand: 'high',   height: 20 },
    { id: 'willow',     name: 'Willow',           demand: 'high',   height: 24 },
    { id: 'poplar',     name: 'Poplar',           demand: 'high',   height: 28 },
    { id: 'elm',        name: 'Elm',              demand: 'high',   height: 24 },
    { id: 'eucalyptus', name: 'Eucalyptus',       demand: 'high',   height: 18 },
    { id: 'hawthorn',   name: 'Hawthorn',         demand: 'high',   height: 10 },
    { id: 'cypress',    name: 'Cypress / Leylandii', demand: 'high', height: 25 },
    { id: 'plane',      name: 'London plane',     demand: 'high',   height: 26 },
    { id: 'ash',        name: 'Ash',              demand: 'medium', height: 23 },
    { id: 'beech',      name: 'Beech',            demand: 'medium', height: 20 },
    { id: 'birch',      name: 'Birch',            demand: 'medium', height: 14 },
    { id: 'cherry',     name: 'Cherry',           demand: 'medium', height: 17 },
    { id: 'chestnut',   name: 'Horse chestnut',   demand: 'medium', height: 20 },
    { id: 'lime',       name: 'Lime',             demand: 'medium', height: 22 },
    { id: 'maple',      name: 'Maple',            demand: 'medium', height: 18 },
    { id: 'sycamore',   name: 'Sycamore',         demand: 'medium', height: 22 },
    { id: 'pine',       name: 'Pine',             demand: 'medium', height: 20 },
    { id: 'alder',      name: 'Alder',            demand: 'medium', height: 18 },
    { id: 'apple',      name: 'Apple / pear',     demand: 'low',    height: 10 },
    { id: 'hazel',      name: 'Hazel',            demand: 'low',    height: 8  },
    { id: 'holly',      name: 'Holly',            demand: 'low',    height: 12 },
    { id: 'laurel',     name: 'Laurel',           demand: 'low',    height: 8  },
    { id: 'magnolia',   name: 'Magnolia',         demand: 'low',    height: 9  },
    { id: 'rowan',      name: 'Rowan',            demand: 'low',    height: 12 },
    { id: 'elder',      name: 'Elder',            demand: 'low',    height: 10 }
  ];

  // Essex and most of the London basin is high-plasticity clay, so that is
  // the default. Getting this wrong is the single biggest error in the model.
  var SOILS = [
    { id: 'high',   name: 'Heavy clay',      note: 'Most of Essex, London and the Home Counties', factor: 1.00 },
    { id: 'medium', name: 'Medium clay',     note: 'Mixed clay and silt',                          factor: 0.85 },
    { id: 'low',    name: 'Light clay',      note: 'Sandy clay, low shrinkage',                    factor: 0.70 },
    { id: 'none',   name: 'Sand, gravel or chalk', note: 'Does not shrink — trees are not a factor', factor: 0.00 }
  ];

  // ANCHORS — [ D/H , required depth in metres ] on high-plasticity clay.
  // Linearly interpolated; beyond the last anchor the tree stops governing.
  var ANCHORS = {
    high:   [[0.20, 3.00], [0.50, 2.50], [0.75, 2.10], [1.00, 1.75], [1.25, 1.50], [1.50, 1.20], [2.00, 1.00]],
    medium: [[0.20, 2.50], [0.50, 2.00], [0.75, 1.70], [1.00, 1.40], [1.25, 1.20], [1.75, 1.00]],
    low:    [[0.20, 2.00], [0.50, 1.60], [0.75, 1.35], [1.00, 1.15], [1.50, 1.00]]
  };

  var MIN_CLAY = 1.00;   // ASSUMPTION  minimum on shrinkable clay, no trees
  var MIN_OTHER = 0.90;  // ASSUMPTION  minimum on non-shrinkable ground
  var MAX_DEPTH = 3.50;  // ASSUMPTION  beyond this, trench fill is not viable

  function bySpeciesId(id) {
    for (var i = 0; i < SPECIES.length; i++) {
      if (SPECIES[i].id === id) return SPECIES[i];
    }
    return null;
  }

  function bySoilId(id) {
    for (var i = 0; i < SOILS.length; i++) {
      if (SOILS[i].id === id) return SOILS[i];
    }
    return SOILS[0];
  }

  function interpolate(anchors, ratio) {
    if (ratio <= anchors[0][0]) return anchors[0][1];
    for (var i = 1; i < anchors.length; i++) {
      if (ratio <= anchors[i][0]) {
        var a = anchors[i - 1], b = anchors[i];
        var t = (ratio - a[0]) / (b[0] - a[0]);
        return a[1] + t * (b[1] - a[1]);
      }
    }
    return 0; // past the last anchor the tree no longer governs
  }

  /**
   * Required foundation depth for one tree.
   * @param {{species:string, distance:number}} tree
   * @param {string} soilId
   * @returns {{depth:number, ratio:number, species:object}}
   */
  function depthForTree(tree, soilId) {
    var species = bySpeciesId(tree.species);
    var soil = bySoilId(soilId);
    if (!species || soil.factor === 0) {
      return { depth: 0, ratio: Infinity, species: species };
    }
    var ratio = tree.distance / species.height;
    var raw = interpolate(ANCHORS[species.demand], ratio);
    return { depth: raw * soil.factor, ratio: ratio, species: species };
  }

  /**
   * Governing depth across every tree on the plot. The deepest one wins —
   * you dig the whole footing to the worst case.
   *
   * `settings` comes from the rate book, so Lee's admin edits reach here.
   */
  function requiredDepth(trees, soilId, settings) {
    var cfg = settings || {};
    var minClay = cfg.nominalDepth || MIN_CLAY;
    var maxDepth = cfg.maxDepth || MAX_DEPTH;
    var pileAt = cfg.pilingThreshold || 2.5;
    var soil = bySoilId(soilId);
    var floor = soil.factor === 0 ? Math.min(MIN_OTHER, minClay) : minClay;
    var governing = null;
    var depth = floor;

    (trees || []).forEach(function (tree) {
      var r = depthForTree(tree, soilId);
      if (r.depth > depth) { depth = r.depth; governing = r; }
    });

    depth = Math.min(Math.round(depth * 20) / 20, maxDepth); // to nearest 50mm
    return {
      depth: depth,
      floor: floor,
      governing: governing,
      soil: soil,
      piled: depth >= pileAt,
      capped: depth >= maxDepth
    };
  }

  root.DATUM = root.DATUM || {};
  root.DATUM.TREES = {
    SPECIES: SPECIES,
    SOILS: SOILS,
    bySpeciesId: bySpeciesId,
    bySoilId: bySoilId,
    depthForTree: depthForTree,
    requiredDepth: requiredDepth
  };
})(window);

/*
 * Datum — rate book store
 * ---------------------------------------------------------------------------
 * Draft and published, with a change log.
 *
 * A quote is priced against a PUBLISHED book. Lee edits a DRAFT, sees what it
 * would do to a typical job, and publishes when he is happy. Live jobs keep the
 * version they were priced on, so nobody's quote moves under them.
 *
 * Persistence is localStorage — this is a demonstration. Swapping it for an API
 * means replacing read() and write().
 */
(function (root) {
  'use strict';

  var RB = root.DATUM.RATEBOOK;
  var KEY = 'datum.ratebook.v1';

  /* Bumped whenever the SHAPE of the book changes — new build types, new steps,
     new question wording. A stored book from an older shape is rebuilt from the
     current defaults with the rates carried across, so nobody is left on a
     structure the app no longer understands. */
  var SCHEMA = 3;

  function now() { return new Date().toISOString(); }

  function blank() {
    var book = RB.defaultBook();
    return {
      schema: SCHEMA,
      published: JSON.parse(JSON.stringify(book)),
      draft: JSON.parse(JSON.stringify(book)),
      dirty: false,
      log: [{ at: now(), who: 'Datum', what: 'Opening rate book created', kind: 'publish' }],
      history: []
    };
  }

  /** Rebuild on the current structure, keeping every rate that still exists. */
  function migrate(old) {
    var fresh = blank();
    try {
      var kept = {};
      ((old.published && old.published.buildTypes) || []).forEach(function (t) {
        (t.lines || []).forEach(function (l) { kept[l.id] = l; });
      });
      ['published', 'draft'].forEach(function (k) {
        fresh[k].buildTypes.forEach(function (t) {
          t.lines.forEach(function (l) {
            var was = kept[l.id];
            if (!was) return;
            l.rate = was.rate;
            l.source = was.source;
            l.enabled = was.enabled !== false;
          });
        });
        if (old.published && old.published.commercial) fresh[k].commercial = old.published.commercial;
        if (old.published && old.published.fees) fresh[k].fees = old.published.fees;
        if (old.published && old.published.foundations) fresh[k].foundations = old.published.foundations;
      });
      fresh.log = (old.log || []).slice(0, 200);
      fresh.log.unshift({ at: now(), who: 'Datum', kind: 'edit',
        what: 'Rate book structure updated. Your rates were carried across.' });
    } catch (e) { /* a fresh book is better than a broken one */ }
    return write(fresh);
  }

  function read() {
    try {
      var raw = root.localStorage.getItem(KEY);
      if (!raw) return blank();
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.draft || !parsed.published) return blank();
      if (parsed.schema !== SCHEMA) return migrate(parsed);
      return parsed;
    } catch (e) {
      return blank();
    }
  }

  function write(state) {
    try { root.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* private mode */ }
    return state;
  }

  var state = read();

  /* ---- reading -------------------------------------------------------- */

  function draft() { return state.draft; }
  function published() { return state.published; }
  function isDirty() { return !!state.dirty; }
  function log() { return state.log; }
  function history() { return state.history; }

  /* ---- editing --------------------------------------------------------- */

  /**
   * Record a change against the draft. `apply` mutates the draft; everything
   * else is bookkeeping so the change log stays truthful.
   */
  function change(description, apply, meta) {
    apply(state.draft);
    state.dirty = true;
    state.log.unshift({
      at: now(), who: 'Lee', what: description, kind: 'edit',
      from: meta && meta.from, to: meta && meta.to
    });
    if (state.log.length > 300) state.log.length = 300;
    write(state);
  }

  function discard() {
    state.draft = JSON.parse(JSON.stringify(state.published));
    state.dirty = false;
    state.log.unshift({ at: now(), who: 'Lee', what: 'Draft discarded, back to the published book', kind: 'discard' });
    write(state);
  }

  /** What publishing the draft would do to each build type's worked example. */
  function impact() {
    var out = [];
    state.published.buildTypes.forEach(function (t) {
      var before = RB.priceTypical(state.published, t.id);
      var after = RB.priceTypical(state.draft, t.id);
      if (!before || !after) return;
      out.push({
        id: t.id, name: t.name, label: t.typical && t.typical.label,
        before: before.incVat, after: after.incVat,
        delta: after.incVat - before.incVat,
        pct: before.incVat ? (after.incVat - before.incVat) / before.incVat : 0
      });
    });
    return out;
  }

  function publish(label) {
    var changes = impact();
    state.history.unshift({
      at: now(), version: state.published.version,
      label: state.published.label,
      book: JSON.parse(JSON.stringify(state.published))
    });
    if (state.history.length > 20) state.history.length = 20;

    state.draft.version = (state.published.version || 1) + 1;
    state.draft.label = label || ('Rate book v' + state.draft.version);
    state.published = JSON.parse(JSON.stringify(state.draft));
    state.dirty = false;
    state.log.unshift({
      at: now(), who: 'Lee', kind: 'publish',
      what: 'Published ' + state.draft.label,
      impact: changes.filter(function (c) { return Math.abs(c.pct) > 0.0005; })
    });
    write(state);
    return changes;
  }

  function rollback(index) {
    var entry = state.history[index];
    if (!entry) return false;
    state.draft = JSON.parse(JSON.stringify(entry.book));
    state.dirty = true;
    state.log.unshift({ at: now(), who: 'Lee', kind: 'edit',
      what: 'Draft reset to ' + (entry.label || ('v' + entry.version)) });
    write(state);
    return true;
  }

  function reset() {
    state = blank();
    write(state);
  }

  /* ---- moving the whole book at once ------------------------------------ */

  /** Annual uplift. Every builder wants this and nobody builds it. */
  function bulkUplift(pct, scope) {
    var n = 0;
    change('Uplifted ' + (scope === 'all' ? 'every rate' : scope) + ' by ' + (pct * 100).toFixed(1) + '%', function (book) {
      book.buildTypes.forEach(function (t) {
        if (scope !== 'all' && scope !== t.id) return;
        t.lines.forEach(function (l) {
          l.rate = Math.round(l.rate * (1 + pct));
          n++;
        });
      });
    });
    return n;
  }

  function exportJson() {
    return JSON.stringify({ exported: now(), book: state.draft }, null, 2);
  }

  function importJson(text) {
    var parsed = JSON.parse(text);
    var book = parsed.book || parsed;
    if (!book.buildTypes || !book.commercial) throw new Error('That file is not a Datum rate book.');
    change('Imported a rate book', function () {});
    state.draft = book;
    write(state);
    return true;
  }

  /**
   * Import rates from a QS spreadsheet saved as CSV.
   * Expected columns: line id, rate. Anything else is ignored, and any id that
   * is not in the book is reported back rather than silently dropped.
   */
  function importCsv(text) {
    var rows = text.split(/\r?\n/).filter(function (r) { return r.trim(); });
    var applied = [], missed = [];
    var index = {};
    state.draft.buildTypes.forEach(function (t) {
      t.lines.forEach(function (l) { index[l.id.toLowerCase()] = l; });
    });

    rows.forEach(function (row, i) {
      var cells = row.split(',').map(function (c) { return c.trim().replace(/^"|"$/g, ''); });
      if (i === 0 && isNaN(parseFloat(cells[1]))) return;   // header
      var id = (cells[0] || '').toLowerCase();
      var rate = parseFloat((cells[1] || '').replace(/[£,]/g, ''));
      if (!id || isNaN(rate)) return;
      if (index[id]) {
        index[id].rate = rate;
        index[id].source = 'lee';
        applied.push(id);
      } else {
        missed.push(cells[0]);
      }
    });

    if (applied.length) {
      state.dirty = true;
      state.log.unshift({ at: now(), who: 'Lee', kind: 'edit',
        what: 'Imported ' + applied.length + ' rates from a spreadsheet' });
      write(state);
    }
    return { applied: applied, missed: missed };
  }

  function exportCsv() {
    var rows = ['line id,rate,build type,item,unit,source'];
    state.draft.buildTypes.forEach(function (t) {
      t.lines.forEach(function (l) {
        rows.push([l.id, l.rate, '"' + t.name + '"', '"' + l.label + '"',
                   RB.UNITS[l.unit].label, l.source].join(','));
      });
    });
    return rows.join('\n');
  }

  root.DATUM.STORE = {
    draft: draft, published: published, isDirty: isDirty,
    log: log, history: history,
    change: change, discard: discard, publish: publish, rollback: rollback,
    impact: impact, bulkUplift: bulkUplift, reset: reset,
    exportJson: exportJson, importJson: importJson,
    importCsv: importCsv, exportCsv: exportCsv
  };
})(window);

            ' aria-label="' + esc(t.name) + ' available to clients"><i></i></label>' +
        '</div>' +
        '<p>' + esc(t.blurb) + '</p>' +
        '<div class="typecard-figs">' +
          '<div><dt>Items</dt><dd>' + t.lines.length + '</dd></div>' +
          '<div><dt>Placeholders</dt><dd' + (n ? ' style="color:var(--warn)"' : '') + '>' + n + '</dd></div>' +
          '<div><dt>Typical job</dt><dd>' + (after ? money(after.incVat) : '—') + '</dd></div>' +
        '</div>' +
        (Math.abs(delta) > 0.5
          ? '<p class="delta ' + (delta > 0 ? 'delta-up' : 'delta-down') + '">' + signed(delta) + ' against the published book</p>'
          : '') +
        '<p style="font-size:.76rem;color:var(--ink-3)">' + esc((t.typical && t.typical.label) || '') + '</p>' +
        '<div class="typecard-actions">' +
          '<button class="btn btn-ghost btn-sm" data-section="type:' + t.id + '">Edit rates</button>' +
        '</div>' +
      '</div>';
    });
    html += '<div class="typecard" style="justify-content:center">' +
      '<h3 style="color:var(--ink-3)">Something else?</h3>' +
      '<p>Garage conversions, garden rooms, outbuildings, driveways on their own. ' +
      'Tell us what you price and it becomes another set of rates in here.</p></div>';
    html += '</div>';
    return html;
  }

  /* ---- build type editor ---------------------------------------------------- */

  function unitOptions(sel) {
    return Object.keys(UNITS).map(function (u) {
      return '<option value="' + u + '"' + (u === sel ? ' selected' : '') + '>' + UNITS[u].label + '</option>';
    }).join('');
  }
  function driverOptions(type, sel) {
    return type.measurements.map(function (m) {
      return '<option value="' + m.id + '"' + (m.id === sel ? ' selected' : '') + '>' +
        esc(m.label) + ' (' + m.unit + ')</option>';
    }).join('');
  }

  function renderType(typeId) {
    var type = RB.typeById(STORE.draft(), typeId);
    if (!type) return '<p class="empty">That build type is not in the book.</p>';

    var html =
      '<div class="sechead"><p class="eyebrow">Build type</p><h2>' + esc(type.name) + '</h2>' +
      '<p>' + esc(type.blurb) + '</p></div>';

    html += '<div class="secrow">' +
      '<label class="switch"><input type="checkbox" data-toggle-type="' + type.id + '"' +
        (type.enabled ? ' checked' : '') + ' aria-label="Available to clients"><i></i></label>' +
      '<span style="font-size:.85rem;color:var(--ink-2)">' + (type.enabled ? 'Live — clients can price this' : 'Hidden from clients') + '</span>' +
      '<span style="margin-left:auto"></span>' +
      '<button class="btn btn-ghost btn-sm" data-uplift="' + type.id + '">Uplift all rates…</button>' +
      '<button class="btn btn-ghost btn-sm" data-addline="' + type.id + '">+ Add an item</button>' +
      '</div>';

    // ---- rate lines
    html += '<div class="panel"><div class="panel-head"><h3>Priced items</h3>' +
      '<span class="spacer"></span><span class="eyebrow">' + type.lines.length + ' items</span></div>' +
      '<div class="tablewrap"><table class="grid-table"><thead><tr>' +
      '<th style="width:26%">Item</th><th style="width:24%">Description</th>' +
      '<th style="width:13%">Unit</th><th style="width:17%">Driven by</th>' +
      '<th class="right" style="width:11%">Rate</th><th style="width:5%">Source</th><th style="width:4%"></th>' +
      '</tr></thead><tbody>';

    type.lines.forEach(function (l) {
      html += '<tr' + (l.enabled ? '' : ' class="off"') + ' data-line="' + l.id + '">' +
        '<td><input class="cell" value="' + esc(l.label) + '" data-f="label" aria-label="Item name"></td>' +
        '<td><input class="cell" value="' + esc(l.detail) + '" data-f="detail" aria-label="Description"></td>' +
        '<td><select class="cell" data-f="unit" aria-label="Unit">' + unitOptions(l.unit) + '</select></td>' +
        '<td><select class="cell" data-f="driver" aria-label="Driven by">' + driverOptions(type, l.driver) + '</select></td>' +
        '<td class="right"><div class="money-cell"><span>£</span>' +
          '<input class="cell cell-num cell-rate" type="number" min="0" step="1" value="' + l.rate +
          '" data-f="rate" aria-label="Rate for ' + esc(l.label) + '"></div></td>' +
        '<td><span class="badge ' + (l.source === 'lee' ? 'badge-lee">Yours' : 'badge-hold">Hold') + '</span></td>' +
        '<td><button class="iconbtn" data-delline="' + l.id + '" title="Remove ' + esc(l.label) + '" aria-label="Remove ' + esc(l.label) + '">×</button></td>' +
      '</tr>';
    });
    html += '</tbody></table></div>' +
      '<p class="panel-note">Type over a rate and it stops being a placeholder. Switch an item off to keep it in the book without pricing it.</p></div>';

    // ---- modifiers
    html += '<div class="panel"><div class="panel-head"><h3>Modifiers</h3><span class="spacer"></span>' +
      '<span class="eyebrow">multiply the rates above</span></div><div class="mods">';
    (type.modifiers || []).forEach(function (m) {
      var scope = m.appliesTo === 'all' ? 'every item'
        : m.appliesTo.length + ' item' + (m.appliesTo.length === 1 ? '' : 's');
      html += '<div class="mod" data-mod="' + m.id + '">' +
        '<div class="mod-top"><h4>' + esc(m.label) + '</h4><span class="scope">applies to ' + scope + '</span></div>' +
        (m.help ? '<p>' + esc(m.help) + '</p>' : '') +
        '<div class="mod-opts">' +
        m.options.map(function (o) {
          return '<div class="mod-opt"><span>' + esc(o.label) + '</span>' +
            '<input class="cell cell-num" type="number" step="0.01" min="0" value="' + o.factor +
            '" data-modopt="' + o.id + '" aria-label="' + esc(m.label + ' — ' + o.label) + ' factor"></div>';
        }).join('') +
        '</div></div>';
    });
    html += '</div><p class="panel-note">1.00 leaves a rate alone. 1.10 adds ten per cent. Factors multiply together.</p></div>';

    // ---- the questions the client is actually asked
    var asked = type.measurements.filter(function (m) { return m.ask; });
    if (asked.length) {
      html += '<div class="panel"><div class="panel-head"><h3>Questions the client sees</h3>' +
        '<span class="spacer"></span><span class="eyebrow">' + (type.steps || []).length + ' pages</span></div>' +
        '<div class="tablewrap"><table class="grid-table"><thead><tr>' +
        '<th style="width:13%">Page</th><th style="width:28%">Question</th><th>Helper text</th>' +
        '<th style="width:12%">Answered with</th></tr></thead><tbody>';
      (type.steps || []).forEach(function (st) {
        asked.filter(function (m) { return m.ask.step === st.id; }).forEach(function (m) {
          html += '<tr data-ask="' + m.id + '">' +
            '<td class="num">' + esc(st.short || st.id) + '</td>' +
            '<td><input class="cell" value="' + esc(m.ask.q) + '" data-askf="q" aria-label="Question for ' + esc(m.label) + '"></td>' +
            '<td><input class="cell" value="' + esc(m.ask.help || '') + '" data-askf="help" aria-label="Helper text for ' + esc(m.label) + '"></td>' +
            '<td class="num">' + esc(m.ask.input) + '</td></tr>';
        });
      });
      html += '</tbody></table></div><p class="panel-note">This is the wording on the public estimator, ' +
        'in the order it is asked. Change it here and the site changes.</p></div>';
    }

    // ---- measurements reference
    html += '<div class="panel"><div class="panel-head"><h3>Measurements</h3><span class="spacer"></span>' +
      '<span class="eyebrow">what the client is asked for</span></div><div class="panel-body">' +
      '<div class="typecard-figs">' +
      type.measurements.map(function (m) {
        return '<div><dt>' + esc(m.label) + '</dt><dd>' + m.unit + (m.derived ? ' <small style="color:var(--ink-3)">derived</small>' : '') + '</dd></div>';
      }).join('') + '</div></div></div>';

    return html;
  }

  /* ---- foundations ----------------------------------------------------------- */

  function renderFoundations() {
    var book = STORE.draft();
    var f = book.foundations;

    var html = '<div class="sechead"><p class="eyebrow">Shared</p><h2>Foundations.</h2>' +
      '<p>Depth comes from the species, its mature height, how far away it is, and the soil — the NHBC approach. ' +
      'The depths below are our draft and need an engineer over them before this prices live work.</p></div>';

    html += '<div class="panel"><div class="panel-head"><h3>Rates and limits</h3></div><div class="panel-body">' +
      '<div class="fields fields-3">' +
      [['nominalDepth', 'Depth already in the £/m² rate', 'm', 0.05],
       ['trenchWidth', 'Trench width', 'm', 0.05],
       ['perCubicMetre', 'Dig, cart away and concrete', '£/m³', 5],
       ['pilingThreshold', 'Switch to piles beyond', 'm', 0.05],
       ['piledPerSqm', 'Piles and ground beam', '£/m² footprint', 5],
       ['maxDepth', 'Deepest we will estimate', 'm', 0.05]].map(function (r) {
        return '<div class="field"><label for="fnd-' + r[0] + '">' + esc(r[1]) + '</label>' +
          '<input id="fnd-' + r[0] + '" type="number" step="' + r[3] + '" min="0" value="' + f[r[0]] +
          '" data-fnd="' + r[0] + '"><span class="hint">' + r[2] + '</span></div>';
      }).join('') + '</div></div></div>';

    // live check
    var check = TREES.requiredDepth([{ species: 'oak', distance: 8 }], 'high', f);
    var check2 = TREES.requiredDepth([{ species: 'birch', distance: 6 }], 'medium', f);
    html += '<div class="panel"><div class="panel-head"><h3>Check it</h3><span class="spacer"></span>' +
      '<span class="eyebrow">recalculates as you edit</span></div><div class="panel-body">' +
      '<div class="typecard-figs">' +
      '<div><dt>Oak, 8 m, heavy clay</dt><dd>' + check.depth.toFixed(2) + ' m' +
        (check.piled ? ' <small style="color:var(--warn)">piled</small>' : '') + '</dd></div>' +
      '<div><dt>Birch, 6 m, medium clay</dt><dd>' + check2.depth.toFixed(2) + ' m' +
        (check2.piled ? ' <small style="color:var(--warn)">piled</small>' : '') + '</dd></div>' +
      '<div><dt>No trees, heavy clay</dt><dd>' + TREES.requiredDepth([], 'high', f).depth.toFixed(2) + ' m</dd></div>' +
      '</div></div></div>';

    html += '<div class="panel"><div class="panel-head"><h3>Species</h3><span class="spacer"></span>' +
      '<span class="eyebrow">' + TREES.SPECIES.length + ' listed</span></div>' +
      '<div class="tablewrap"><table class="grid-table"><thead><tr>' +
      '<th>Species</th><th style="width:22%">Water demand</th><th class="right" style="width:20%">Mature height</th>' +
      '</tr></thead><tbody>';
    TREES.SPECIES.forEach(function (sp) {
      html += '<tr><td>' + esc(sp.name) + '</td>' +
        '<td><span class="badge ' + (sp.demand === 'high' ? 'badge-hold' : 'badge-lee') + '">' + sp.demand + '</span></td>' +
        '<td class="right num">' + sp.height + ' m</td></tr>';
    });
    html += '</tbody></table></div>' +
      '<p class="panel-note">Mature heights and water demand follow NHBC Chapter 4.2. Editing the species table is the next thing to build — the depth curves want an engineer’s eye first.</p></div>';

    return html;
  }

  /* ---- commercial ----------------------------------------------------------------- */

  function renderCommercial() {
    var c = STORE.draft().commercial;
    var split = c.margin.datum + c.margin.trade;
    var mismatch = Math.abs(split - c.margin.total) > 0.0001;

    var html = '<div class="sechead"><p class="eyebrow">Shared</p><h2>Commercial terms.</h2>' +
      '<p>Margin, contingency and VAT. These apply to every job in the book.</p></div>';

    html += '<div class="panel"><div class="panel-head"><h3>The big one</h3></div><div class="panel-body">' +
      '<div class="field field-wide"><label for="mir">Are your rates cost, or a selling price?</label>' +
      '<select id="mir" data-comm="marginIncludedInRates">' +
        '<option value="false"' + (!c.marginIncludedInRates ? ' selected' : '') + '>Cost — add the margin on top</option>' +
        '<option value="true"' + (c.marginIncludedInRates ? ' selected' : '') + '>Selling price — the margin is already inside</option>' +
      '</select>' +
      '<span class="hint">This moves every headline figure by about fifteen per cent. It is currently set to treat your rates as cost, ' +
      'because the brief said the software uses them "in the background". Switch it and watch the rail.</span></div>' +
      '</div></div>';

    html += '<div class="panel"><div class="panel-head"><h3>Margin, contingency and VAT</h3></div><div class="panel-body">' +
      '<div class="fields fields-3">' +
      '<div class="field"><label for="c-total">Total margin</label><input id="c-total" type="number" step="0.005" min="0" value="' + c.margin.total + '" data-comm="margin.total"><span class="hint">0.15 is fifteen per cent</span></div>' +
      '<div class="field"><label for="c-datum">Datum’s share</label><input id="c-datum" type="number" step="0.005" min="0" value="' + c.margin.datum + '" data-comm="margin.datum"><span class="hint">Percentage points of the total</span></div>' +
      '<div class="field"><label for="c-trade">Builder and consultants</label><input id="c-trade" type="number" step="0.005" min="0" value="' + c.margin.trade + '" data-comm="margin.trade"><span class="hint">Percentage points of the total</span></div>' +
      '<div class="field"><label for="c-cont">Contingency</label><input id="c-cont" type="number" step="0.005" min="0" value="' + c.contingency + '" data-comm="contingency"><span class="hint">Shown as its own line, returned if unspent</span></div>' +
      '<div class="field"><label for="c-vat">VAT</label><input id="c-vat" type="number" step="0.01" min="0" value="' + c.vatRate + '" data-comm="vatRate"><span class="hint">0.20 is the standard rate</span></div>' +
      '</div>' +
      (mismatch
        ? '<div class="flag" style="margin-top:.9rem"><span><b>The split does not add up.</b> Datum ' + pct(c.margin.datum) +
          ' plus trade ' + pct(c.margin.trade) + ' comes to ' + pct(split) + ', but the total margin is set to ' +
          pct(c.margin.total) + '. The total is what gets charged; the split is what gets reported.</span></div>'
        : '<div class="flag flag-good" style="margin-top:.9rem"><span><b>Split checks out.</b> ' +
          pct(c.margin.datum) + ' to Datum, ' + pct(c.margin.trade) + ' to the builder and consultants, ' + pct(c.margin.total) + ' in total.</span></div>') +
      '</div></div>';

    html += '<div class="panel"><div class="panel-head"><h3>Confidence range</h3></div><div class="panel-body">' +
      '<div class="fields fields-3">' +
      '<div class="field"><label for="c-start">Opening spread</label><input id="c-start" type="number" step="0.01" min="0" value="' + c.confidence.start + '" data-comm="confidence.start"><span class="hint">0.30 shows as plus or minus 30%</span></div>' +
      '<div class="field"><label for="c-floor">Tightest it goes</label><input id="c-floor" type="number" step="0.01" min="0" value="' + c.confidence.floor + '" data-comm="confidence.floor"><span class="hint">Never claim better than this without a survey</span></div>' +
      '<div class="field"><label for="c-per">Tightening per answer</label><input id="c-per" type="number" step="0.005" min="0" value="' + c.confidence.perAnswer + '" data-comm="confidence.perAnswer"><span class="hint">Taken off the spread each time a question is answered</span></div>' +
      '</div></div></div>';
    return html;
  }

  function renderHistory() {
    var log = STORE.log(), hist = STORE.history();
