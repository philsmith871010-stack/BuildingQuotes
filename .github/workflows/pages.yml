# Deploy Datum to GitHub Pages.
#
# Three self-contained pages, no external assets and nothing else served —
# the repository source is not exposed by the deployed site.
#
#   /              the combined demo, client view and rate book with a switcher
#   /client.html   the client estimator on its own
#   /rates.html    the rate book on its own
#
# client.html and rates.html are same-origin, so rates published in the book
# reach the estimator exactly as they would in production.
#
# One-time setup: repository Settings → Pages → Source → "GitHub Actions".

name: Deploy to Pages

on:
  push:
    branches:
      - main
      - claude/website-design-planning-cnoltd
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: node build.mjs

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp dist/demo.html  _site/index.html
          cp dist/index.html _site/client.html
          cp dist/admin.html _site/rates.html
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
